[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.12"
]
build-backend = "scikit_build_core.build"

[project]
name = "iskierka"
version = "2.0.0"
description = "Contains IskierkaGen, a synthetic data generator"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[tool.scikit-build]
cmake.source-dir = "."