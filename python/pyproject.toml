[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.12"
]
build-backend = "scikit_build_core.build"

[project]
name = "iskierka"
version = "2.0.6"
description = "Contains IskierkaGen, a synthetic data generator"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[tool.scikit-build]
cmake.source-dir = "."
sdist.include = [
    "CMakeLists.txt",
    "bindings.cpp",
    "iskierka.h",
]

[tool.cibuildwheel]
skip = "*t-*"
test-requires = ["pytest"]
test-command = "python -m pytest {project}/tests"
